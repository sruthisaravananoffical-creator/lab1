<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> To Do List</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 40px auto;
}

textarea {
    width: 100%;
    height: 70px;
}

button {
    margin-top: 10px;
    margin-right: 10px;
}

.red { color: red; }
.black { color: black; }
.grey { color: grey; }

.completed {
    text-decoration: line-through;
}

.hidden {
    display: none;
}
</style>
</head>

<body>

<h2>ToDo List</h2>
<h3>Please enter or delete the tasks according to schedule. </h3>
<br>
<textarea id="input" placeholder="Task content, category (1/2/3)
Separate multiple tasks with ;"></textarea>
<br>

<button onclick="addTask()">ADD</button>
<button onclick="toggleCompleted()">TOGGLE</button>

<ol id="list">
    <!-- Predefined tasks -->
    <li class="black">Dinner with friends</li>
    <li class="red">Assignment 1</li>
    <li class="grey">Prepare for Lecture : Web Server</li>
</ol>

<script>
let hideCompleted = false;

// Attach click and double-click events to existing tasks
function attachEvents(li) {
    // single click → complete/resume
    li.onclick = function () {
        li.classList.toggle("completed");
        if (hideCompleted && li.classList.contains("completed")) {
            li.classList.add("hidden");
        } else {
            li.classList.remove("hidden");
        }
    };

    // double click → delete (with confirm)
    li.ondblclick = function () {
        if (confirm("Delete this task?")) {
            li.remove();
        }
    };
}

// Attach events to predefined tasks
document.querySelectorAll("#list li").forEach(attachEvents);

function addTask() {
    const input = document.getElementById("input").value.trim();
    if (!input) return;

    const tasks = input.split(";");

    tasks.forEach(task => {
        const parts = task.split(",");
        if (parts.length !== 2) return;

        const content = parts[0].trim();
        const category = parts[1].trim();

        const li = document.createElement("li");
        li.textContent = content;

        if (category === "1") li.classList.add("red");
        else if (category === "2") li.classList.add("black");
        else if (category === "3") li.classList.add("grey");

        attachEvents(li);
        document.getElementById("list").appendChild(li);
    });

    document.getElementById("input").value = "";
}

function toggleCompleted() {
    hideCompleted = !hideCompleted;
    const items = document.querySelectorAll("#list li");

    items.forEach(item => {
        if (item.classList.contains("completed")) {
            if (hideCompleted) {
                item.classList.add("hidden");
            } else {
                item.classList.remove("hidden");
            }
        }
    });
}
</script>

</body>
</html>
